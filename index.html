<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REST API To-Do Application</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-gray: #6b7280;
      --danger: #ef4444;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--primary);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .filter-btn {
      background: transparent;
      color: var(--text-gray);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      font-size: 0.875rem;
      border-radius: 6px;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .todo-list {
      list-style: none;
      max-height: 350px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.75rem;
      background: white;
      transition: transform 0.1s;
    }

    .todo-item:hover {
      transform: translateY(-1px);
    }

    .todo-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      word-break: break-all;
    }

    .todo-item.completed span {
      text-decoration: line-through;
      color: var(--text-gray);
    }

    .delete-btn {
      background: transparent;
      color: var(--danger);
      padding: 0.4rem;
      border-radius: 4px;
    }

    .delete-btn:hover {
      background: #fee2e2;
    }

    .loading {
      text-align: center;
      color: var(--text-gray);
      padding: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1><i class="fa-solid fa-list-check"></i> REST API To-Do App</h1>
    
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="Add a new task...">
      <button onclick="addTodo()"><i class="fa-solid fa-plus"></i> Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
    </div>

    <div id="loading" class="loading">Loading tasks from REST API...</div>
    <ul class="todo-list" id="todoList"></ul>
  </div>

  <script>
    const API_URL = 'https://jsonplaceholder.typicode.com/todos?_limit=5';
    let todos = [];
    let currentFilter = 'all';

    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');
    const loading = document.getElementById('loading');

    // Fetch initial data from REST API
    async function fetchTodos() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        todos = data.map(item => ({ id: item.id, title: item.title, completed: item.completed }));
        loading.style.display = 'none';
        renderTodos();
      } catch (error) {
        loading.innerText = 'Failed to load tasks from API.';
        console.error('Error fetching todos:', error);
      }
    }

    function renderTodos() {
      const filtered = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      todoList.innerHTML = filtered.map(todo => `
        <li class="todo-item ${todo.completed ? 'completed' : ''}">
          <div class="todo-content">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} onclick="toggleTodo(${todo.id})">
            <span>${escapeHTML(todo.title)}</span>
          </div>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})"><i class="fa-solid fa-trash"></i></button>
        </li>
      `).join('');
    }

    async function addTodo() {
      const title = todoInput.value.trim();
      if (!title) return;

      // Simulating REST API POST request
      const newTodo = {
        id: Date.now(),
        title: title,
        completed: false
      };

      todos.unshift(newTodo);
      todoInput.value = '';
      renderTodos();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        renderTodos();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      renderTodos();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTodos();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Initialize app
    fetchTodos();
  </script>
</body>
</html>
